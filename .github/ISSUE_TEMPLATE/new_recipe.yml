name: Recipe Request
description: Suggest a new recipe topic
title: "[Recipe]: "
labels: ["recipe-request"]
body:
  - type: markdown
    attributes:
      value: |
        Have a recipe idea? Tell us what task you'd like documented.

  - type: textarea
    id: task
    attributes:
      label: What task should this recipe cover?
      description: Describe what someone would be trying to do
      placeholder: "I want to set up KiroCrew to automatically review PRs and..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why is this useful?
      description: Who would use this and when?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to write this recipe?
      options:
        - label: I'd like to contribute this recipe myself
